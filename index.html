<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탈 · Cheongsol Village</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#151a24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap">
<style>
/* Layout: one-screen phone game. Ink-night frame, scene window on top, hanji paper dialogue sheet below. */
:root{
  --ink:#151a24;        /* night ink, page ground */
  --ink-2:#212937;      /* bars, sheets */
  --ink-3:#2e3848;
  --mist:#aab4c3;       /* secondary text on ink */
  --paper:#ebe2cd;      /* hanji */
  --paper-2:#ded3ba;
  --paper-ink:#2a231d;  /* text on paper */
  --paper-mute:#7b705f;
  --celadon:#3f8b77;    /* dancheong green: figured out */
  --celadon-lt:#7cc3ae;
  --ochre:#c98f2c;      /* dancheong ochre: new words, hints */
  --cinnabar:#b5412d;   /* sparing: alerts */
  --f-brush:"Nanum Brush Script","Gowun Batang",serif;
  --f-ko:"Gowun Batang","Noto Serif KR",serif;
  --f-ui:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--celadon-lt);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;box-sizing:border-box}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-height:44px}
.loc{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.loc .ko{white-space:nowrap;flex:none;font-family:var(--f-brush);font-size:2rem;line-height:1;color:var(--paper);background:none;border:0;padding:0}
.loc .sub{font-size:.78rem;color:var(--mist);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--ink-3);background:var(--ink-2);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px;stroke:var(--paper);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ochre)}

/* scene */
.scene{position:relative;width:min(100%,52vh);aspect-ratio:4/3;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;background:#0d1118;flex:0 0 auto;box-shadow:0 0 0 1px var(--ink-3)}
.scene svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.hs i{width:14px;height:14px;transform:rotate(45deg);border:2px solid #fff;background:rgba(201,143,44,.85);box-shadow:0 0 0 4px rgba(255,255,255,.18);animation:pulse 2.4s ease-in-out infinite}
.hs span{font-size:.7rem;background:rgba(21,26,36,.82);color:#f3ecdc;padding:2px 7px;border-radius:99px;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.glow{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;pointer-events:none;
  border:3px solid rgba(255,214,120,.95);box-shadow:0 0 18px 6px rgba(255,200,90,.55),inset 0 0 14px rgba(255,214,120,.5);
  animation:glow 1.1s ease-in-out 3 both}
@keyframes glow{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}40%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.vf{position:absolute;inset:8%;border:2px solid rgba(255,255,255,.7);border-radius:6px;pointer-events:none}
.vf::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border:2px solid #ffd35a;border-radius:4px}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-400px)}}
@media (prefers-reduced-motion:reduce){.drift,.hs i{animation:none}.glow{animation-iteration-count:1}}

/* paper sheet */
.sheet{flex:1;min-height:0;background:var(--paper);color:var(--paper-ink);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(120,100,70,.08) 1px,transparent 1.4px),radial-gradient(rgba(120,100,70,.06) 1px,transparent 1.2px);background-size:7px 7px,11px 13px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;transition:opacity .2s}
.who{display:flex;align-items:center;gap:10px}
.chip{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ko);font-weight:700;color:#fff;flex:0 0 auto}
.who b{font-family:var(--f-ko);font-size:1rem}
.say{margin-left:auto;border:1px solid var(--paper-2);background:transparent;border-radius:99px;padding:4px 10px;font-size:.8rem;color:var(--paper-mute)}
.koline{font-family:var(--f-ko);font-size:1.5rem;line-height:1.7;word-break:keep-all;text-wrap:pretty}
.koline.sign{background:#f6f0e0;border:1px solid #cbbf9f;box-shadow:2px 3px 0 rgba(60,45,25,.12);padding:12px 16px;border-radius:4px;transform:rotate(-.6deg);font-size:1.4rem}
.koline.led{font-family:ui-monospace,monospace;background:#120e0a;color:#ffb347;padding:10px 14px;border-radius:6px;font-size:1.25rem}
.en{font-size:.98rem;line-height:1.55;color:var(--paper-mute);max-width:62ch}
.narr{font-size:1.06rem;line-height:1.6;color:var(--paper-ink)}
.w{background:none;border:0;padding:0 1px;margin:0;font:inherit;color:inherit;border-bottom:2px dotted var(--ochre);border-radius:2px}
.w.learned{color:var(--celadon);border-bottom:2px solid rgba(63,139,119,.35)}
.w.gram{border-bottom:1px solid rgba(123,112,95,.4);color:#5b5246}
.w:active{background:rgba(201,143,44,.2)}
.led .w{border-bottom-color:#7a5520}
.led .w.gram{color:#c98f4a}
.btn{border:1.5px solid var(--paper-ink);background:transparent;border-radius:12px;padding:12px 14px;text-align:left;font-size:1rem;display:flex;align-items:center;gap:10px;min-height:48px}
.btn.ko{font-family:var(--f-ko);font-size:1.25rem}
.btn.act{color:var(--paper-ink)}
.btn.act::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--ochre);flex:0 0 auto}
.btn.primary{background:var(--paper-ink);color:var(--paper);justify-content:center;font-weight:600}
.btn:active{transform:translateY(1px)}
.acts{display:flex;flex-direction:column;gap:8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-ko);font-size:1.2rem;border:1.5px solid var(--paper-ink);background:#f6f0e0;border-radius:10px;padding:8px 12px}
.tile[disabled]{opacity:.25}
.built{min-height:56px;border-bottom:2px solid var(--paper-ink);font-family:var(--f-ko);font-size:1.45rem;display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.built .ph{color:var(--paper-mute);font-family:var(--f-ui);font-size:.95rem}
.row{display:flex;gap:8px}
.row>*{flex:1}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--paper-ink);background:#fff;margin:6px auto;display:block;box-shadow:inset 0 0 0 4px var(--paper)}
.photo{width:100%;max-width:320px;border:8px solid #fff;border-bottom-width:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:rotate(1.2deg);align-self:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,13,19,.6);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px))}
.panel{width:100%;max-width:560px;max-height:88%;background:var(--ink-2);color:var(--paper);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.panel.paper{background:var(--paper);color:var(--paper-ink)}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ink-3)}
.paper .ph-head{border-color:var(--paper-2)}
.ph-head h2{margin:0;font-family:var(--f-brush);font-weight:400;font-size:1.9rem;line-height:1;flex:1}
.ph-head .x{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px}
.ph-body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--ink-3);background:transparent;border-radius:99px;padding:6px 12px;font-size:.85rem;color:var(--mist)}
.tab.on{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{border:1px solid var(--ink-3);background:var(--ink);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;justify-content:center}
.card .k{font-family:var(--f-ko);font-size:1.15rem;word-break:keep-all;text-align:center}
.card .ic{width:40px;height:40px;display:grid;place-items:center;color:var(--mist);font-size:1.2rem}
.card .ic svg{width:40px;height:40px;background:var(--paper);border-radius:8px}
.card .tag{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.card.learned{border-color:rgba(124,195,174,.5)}
.card.learned .k{color:var(--celadon-lt)}
.card.new .tag{color:var(--ochre)}
.empty{color:var(--mist);font-size:.92rem;line-height:1.5}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mist)}
.paper .label{color:var(--paper-mute)}
.wordhead{display:flex;align-items:center;gap:16px}
.bigicon{width:112px;height:112px;flex:0 0 auto;background:#f6f0e0;border:1px solid #cbbf9f;border-radius:16px;box-shadow:2px 3px 0 rgba(60,45,25,.1)}
.bigword{font-family:var(--f-ko);font-size:2.4rem;line-height:1.1;word-break:keep-all}
.badge{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.ctx{font-family:var(--f-ko);font-size:1.05rem;line-height:1.55;padding:8px 10px;border-left:3px solid var(--paper-2);background:rgba(255,255,255,.35)}
.ctx mark{background:rgba(201,143,44,.28);color:inherit;padding:0 2px;border-radius:2px}
textarea{width:100%;box-sizing:border-box;min-height:64px;border-radius:10px;border:1px solid var(--paper-2);background:#f6f0e0;color:var(--paper-ink);font:inherit;padding:10px;resize:vertical}
.q{border:1px solid var(--ink-3);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ink)}
.q.solved{border-color:rgba(124,195,174,.45)}
.q .qt{font-size:1.02rem;line-height:1.45}
.q .ans{font-family:var(--f-ko);font-size:1.4rem;color:var(--celadon-lt);display:flex;align-items:center;gap:10px}
.q .ans svg{width:40px;height:40px;background:var(--paper);border-radius:8px}
.q .why{color:var(--mist);font-size:.9rem;line-height:1.5}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font-family:var(--f-ko);font-size:1.05rem;border:1px solid var(--ink-3);background:var(--ink-2);border-radius:10px;padding:6px 10px}
.pick button.learned{color:var(--celadon-lt)}
.miss{color:#e59a87;font-size:.9rem}
.btn-ink{border:1px solid var(--ink-3);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:1rem}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--paper);color:var(--paper-ink);border-radius:99px;padding:8px 16px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .3s ease-out;display:flex;align-items:center;gap:8px}
.toast b{font-family:var(--f-ko);color:var(--celadon)}
.toast svg{width:26px;height:26px}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* phone */
.phone{width:min(100%,380px);height:min(86%,700px);background:#0b0d12;border-radius:34px;border:8px solid #1b1f27;display:flex;flex-direction:column;overflow:hidden;margin:auto;align-self:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ov.center{align-items:center}
.ph-status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:.75rem;color:#c9cfdb}
.ph-top{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;border-bottom:1px solid #222834;color:#fff}
.ph-top b{flex:1;font-size:1.05rem}
.ph-top button{border:0;background:none;color:#8fd3c0;font-size:1rem;padding:6px}
.ph-list{flex:1;overflow-y:auto}
.thr{width:100%;border:0;background:none;color:#e9edf3;text-align:left;display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #1a1f29;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:0 0 auto;color:#fff}
.thr .nm{font-weight:600}
.thr .pv{font-size:.82rem;color:#8b93a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .new{width:9px;height:9px;border-radius:50%;background:#3fbf9b;margin-left:auto;flex:0 0 auto}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#10141b}
.day{align-self:center;font-size:.8rem;color:#8b93a3;font-family:var(--f-ko);padding:6px 0}
.day .w{border-bottom-color:#6e5a32}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-family:var(--f-ko);font-size:1.12rem;line-height:1.5;color:#e9edf3;background:#252c39;align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:#2f6f61;border-radius:16px;border-bottom-right-radius:4px}
.bub small{display:block;font-family:var(--f-ui);font-size:.68rem;color:#9aa3b3;margin-top:2px}
.bub .w{border-bottom-color:#b88a3a}
.bub .w.learned{color:#9be0cb}
.bub .w.gram{color:#c9cfdb;border-bottom-color:rgba(201,207,219,.3)}
.bub.sys{align-self:center;background:transparent;color:#e07b69;font-size:.9rem}
.ph-note{font-size:.88rem;color:#9aa3b3;line-height:1.5;padding:8px 4px}

/* title */
.title{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.title .art{width:min(100%,420px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--ink-3)}
.title .art svg{width:100%;height:100%;display:block}
.title h1{font-family:var(--f-brush);font-weight:400;font-size:5.5rem;line-height:.9;margin:6px 0 0;color:var(--paper)}
.title .vil{font-family:var(--f-ko);font-size:1.15rem;color:var(--mist);letter-spacing:.3em}
.title p{max-width:34ch;color:var(--mist);line-height:1.55;margin:0;font-size:.95rem}
.title .acts{width:min(100%,320px)}
.title .btn{border-color:var(--paper);color:var(--paper);justify-content:center}
.title .btn.primary{background:var(--paper);color:var(--paper-ink)}
.fine{font-size:.78rem;color:#6f7a8b;max-width:36ch;line-height:1.5}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink-3)}
.set-row .seg{display:flex;gap:4px}
.set-row .seg button{border:1px solid var(--ink-3);background:var(--ink);border-radius:8px;padding:6px 10px;font-size:.85rem}
.set-row .seg button.on{background:var(--paper);color:var(--paper-ink)}
.stat{display:flex;justify-content:space-between;font-size:1rem;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.stat b{font-variant-numeric:tabular-nums}
.boot{position:fixed;inset:0;display:grid;place-items:center;color:var(--mist);font-family:var(--f-brush);font-size:4rem}
.boot span{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* ---------- v2 look: layers, portraits, reveal, ambience ---------- */
.ib{width:38px;height:38px;border-radius:11px}
.bar{gap:6px}
.scene{box-shadow:0 0 0 1px #3a3328,0 10px 28px rgba(0,0,0,.45);border-radius:16px}
.artwrap,.amb,.fx{position:absolute;inset:0}
.artwrap.in{animation:artin .55s ease}
@keyframes artin{from{opacity:0;filter:blur(3px)}}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:inherit;
  box-shadow:inset 0 0 40px rgba(10,8,5,.35);background:radial-gradient(ellipse at 50% 40%,transparent 60%,rgba(10,8,5,.18))}
.amb{z-index:1;pointer-events:none;overflow:hidden}
.fx{z-index:3}
.fx .glow,.fx .vf,.fx .flash,.fx .placecard,.fx .card-title{pointer-events:none}
.placecard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:radial-gradient(ellipse at center,rgba(12,14,20,.62),rgba(12,14,20,.12) 70%);color:#f6eedc;animation:pcard 2.1s ease forwards}
.placecard b{font-family:var(--f-brush);font-weight:400;font-size:3.4rem;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.placecard span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
@keyframes pcard{0%{opacity:0}15%{opacity:1}65%{opacity:1}100%{opacity:0;visibility:hidden}}
.card-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(12,14,20,.78);color:#f6eedc;animation:artin 1s ease}
.card-title b{font-family:var(--f-brush);font-weight:400;font-size:4.2rem;line-height:1}
.card-title span{font-family:var(--f-ko);font-size:1.1rem;letter-spacing:.3em;opacity:.8}

/* ambience particles */
.p{position:absolute;top:-8%;display:block;animation:fall var(--d) linear var(--delay) infinite}
.p.leaves,.p.petals{width:calc(11px*var(--s));height:calc(7px*var(--s));border-radius:0 80% 0 80%;background:#d9822b;opacity:.9}
.p.leaves:nth-child(3n){background:#b5412d}.p.leaves:nth-child(3n+1){background:#e2a63a}
.p.petals{background:#f1b9c6}
@keyframes fall{0%{top:-8%;transform:translateX(0) rotate(0)}50%{transform:translateX(var(--dx)) rotate(180deg)}100%{top:108%;transform:translateX(calc(var(--dx)*-.4)) rotate(380deg)}}
.p.snow{width:calc(5px*var(--s));height:calc(5px*var(--s));border-radius:50%;background:#fff;opacity:.85}
.p.rain{width:1.5px;height:calc(16px*var(--s));background:rgba(205,222,255,.55);animation-name:drop}
@keyframes drop{0%{top:-10%}100%{top:110%}}
.p.motes{top:auto;bottom:-6%;width:calc(5px*var(--s));height:calc(5px*var(--s));border-radius:50%;background:#ffd27a;box-shadow:0 0 8px 3px rgba(255,190,90,.55);animation-name:rise}
@keyframes rise{0%{bottom:-6%;opacity:0;transform:translateX(0)}20%{opacity:.95}100%{bottom:106%;opacity:0;transform:translateX(var(--dx))}}
.p.dust{width:calc(3px*var(--s));height:calc(3px*var(--s));border-radius:50%;background:rgba(255,240,205,.85);animation-name:floaty}
@keyframes floaty{0%,100%{transform:translate(0,0);opacity:.15}50%{transform:translate(var(--dx),-18px);opacity:.9}}
.title .art{position:relative}
.title .amb{position:absolute;inset:0}
@media (prefers-reduced-motion:reduce){.amb{display:none}.rv{animation:none!important}.pt{animation:none!important}}

/* dialogue */
.line{display:flex;gap:14px;align-items:flex-start}
.spk{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pt{width:78px;height:78px;border-radius:50%;overflow:hidden;border:2px solid var(--paper-ink);
  background:radial-gradient(circle at 50% 35%,#fbf6ea 0 38%,color-mix(in srgb,var(--cbg) 35%,#f6f0e0) 70%);box-shadow:2px 3px 0 rgba(60,45,25,.15)}
.pt svg{width:100%;height:100%;display:block;transform:translateY(6%)}
.pt.sm{width:40px;height:40px;flex:0 0 auto;border-width:1.5px;box-shadow:none}
.pt.happy{animation:hop .5s ease}.pt.surprised{animation:jolt .35s ease}.pt.worried{animation:tremble .45s ease}.pt.sad{animation:sink .7s ease}
@keyframes hop{30%{transform:translateY(-7px)}60%{transform:translateY(0)}80%{transform:translateY(-2px)}}
@keyframes jolt{25%{transform:scale(1.09) rotate(-2deg)}100%{transform:scale(1)}}
@keyframes tremble{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
@keyframes sink{50%{transform:translateY(4px)}}
.seal{background:var(--cinnabar);color:#fff4e6;font-family:var(--f-ko);font-weight:700;font-size:.78rem;padding:3px 8px;border-radius:3px;transform:rotate(-2deg);
  box-shadow:inset 0 0 0 1.5px rgba(255,240,220,.5);white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.talk{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:4px}
.talk .say{margin-left:0}
.rv{animation:rv .38s ease both}
@keyframes rv{from{opacity:0;transform:translateY(5px)}}
.btn .qm{font-family:var(--f-ko);font-size:1.6rem;line-height:0;color:var(--cinnabar);margin-right:-2px}
.btn .qm:last-child{margin-right:0;margin-left:2px}
.btn.primary{letter-spacing:.02em}
:root[data-size="0"] .koline{font-size:1.28rem}
:root[data-size="2"] .koline{font-size:1.85rem}
:root[data-size="2"] .btn.ko{font-size:1.45rem}

/* map */
.loc .ko,.loc .sub{cursor:pointer}
.loc .sub::before{content:"▾ ";color:var(--ochre)}
.map{position:relative;width:min(100%,calc(66vh*400/520));aspect-ratio:400/520;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px #cbbf9f,2px 4px 0 rgba(60,45,25,.12)}
.mapart{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column-reverse;align-items:center;gap:1px;background:none;border:0;padding:4px 6px;color:var(--paper-ink)}
.pin i{width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--cinnabar);border:2px solid #fff;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.pin b{font-family:var(--f-brush);font-weight:400;font-size:1.45rem;line-height:1;text-shadow:0 0 3px #f3ead4,0 0 6px #f3ead4,0 0 8px #f3ead4;white-space:nowrap}
.pin.here i{background:var(--celadon);animation:pulse 2s ease-in-out infinite}
.pin .seal{font-size:.68rem;padding:1px 6px;border:0}
.pin.unk{opacity:.6;pointer-events:none}
.pin.unk i{background:#9a8f7d}
.btn.act.map::before{background:var(--celadon)}
/* chapter list */
.chrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px;border:1px solid var(--ink-3);border-radius:14px;background:var(--ink)}
.chrow.cur{border-color:rgba(124,195,174,.5)}
.chrow.locked{opacity:.55}
.chn{display:flex;align-items:baseline;gap:10px;min-width:0}
.chn b{font-family:var(--f-brush);font-weight:400;font-size:2rem;line-height:1}
.chn span{font-family:var(--f-ko);color:var(--mist)}
.chs{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.chb{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chb:empty{display:none}
.ov{z-index:40}
.toasts{z-index:50}
/* ---------- v3: playtest fixes ---------- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text}
/* word colors (on paper) */
.w{border-bottom:2px solid transparent;font-weight:inherit}
.w.new{color:#a8620f;border-bottom:2px dotted #c98f2c;font-weight:700}
.w.seen{color:#3d5f9a;border-bottom:2px dotted rgba(61,95,154,.55)}
.w.guess{color:#7a4a9a;border-bottom:2px dashed rgba(122,74,154,.6)}
.w.sure{color:var(--celadon);border-bottom:2px solid rgba(63,139,119,.45)}
.w.gram{color:#6b6255;border-bottom:1px solid rgba(123,112,95,.35)}
/* same colors, lighter, on dark backgrounds */
.bub .w.new,.led .w.new,.day .w.new,.pick .w.new{color:#f0b35a;border-bottom-color:#f0b35a}
.bub .w.seen,.led .w.seen,.day .w.seen,.pick .w.seen{color:#9db8ea;border-bottom-color:rgba(157,184,234,.6)}
.bub .w.guess,.led .w.guess,.day .w.guess,.pick .w.guess{color:#c9a3e6;border-bottom-color:rgba(201,163,230,.6)}
.bub .w.sure,.led .w.sure,.day .w.sure,.pick .w.sure{color:#8fe0c6;border-bottom-color:rgba(143,224,198,.6)}
.bub .w.gram,.led .w.gram,.day .w.gram{color:#c9cfdb}
.w.demo{font-family:var(--f-ko);font-size:1.3rem;flex:0 0 44px;text-align:center}
.badge.st-new{color:#a8620f}.badge.st-seen{color:#3d5f9a}.badge.st-guess{color:#7a4a9a}.badge.st-sure{color:var(--celadon)}.badge.st-gram{color:var(--paper-mute)}
/* explore: compact choices inside the scrolling paper */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chipbtn{border:1.5px solid var(--paper-ink);background:#f6f0e0;border-radius:10px;padding:9px 10px;font-size:.92rem;text-align:left;display:flex;align-items:center;gap:8px;min-height:44px;color:var(--paper-ink)}
.chipbtn::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--ochre);flex:0 0 auto}
.chipbtn.mapchip::before{background:var(--celadon)}
.chipbtn:active{transform:translateY(1px)}
.controw{display:flex;gap:8px}
.controw .btn.primary,.controw .btn.act{flex:1}
.btn.back{flex:0 0 auto;min-width:84px;justify-content:center;padding:12px 10px;color:var(--paper-ink)}
.btn.dev{min-height:36px;padding:6px 10px;font-size:.82rem;justify-content:center;border-style:dashed;color:var(--paper-mute)}
/* notebook page */
.defbox{background:#f6f0e0;border:1px solid #cbbf9f;border-radius:10px;padding:10px 12px;line-height:1.55}
.surebox{display:flex;align-items:center;gap:10px;font-size:1rem;padding:4px 2px}
.surebox input{width:22px;height:22px;accent-color:var(--celadon)}
.surebox input:disabled+span{opacity:.45}
.linkish{background:none;border:0;padding:0;color:var(--paper-mute);text-decoration:underline;font-size:.88rem;align-self:flex-start}
.card{align-items:flex-start;text-align:left;gap:3px;padding:10px}
.card .note{font-size:.78rem;color:var(--mist);line-height:1.3;max-height:2.6em;overflow:hidden}
.card.st-sure{border-color:rgba(124,195,174,.55)}.card.st-sure .k{color:var(--celadon-lt)}
.card.st-guess{border-color:rgba(201,163,230,.45)}.card.st-guess .k{color:#c9a3e6}
.card.st-new .k{color:#f0b35a}.card.st-seen .k{color:#9db8ea}
.card.st-new .tag,.card.st-seen .tag{color:var(--mist)}
.glist{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--ink);border:1px solid var(--ink-3);border-radius:10px;padding:10px 12px;color:var(--paper)}
.grow b{font-family:var(--f-ko);font-size:1.15rem}
.grow span{font-size:.9rem;color:var(--mist);line-height:1.45}
.symlist{display:flex;flex-direction:column;gap:10px}
.symrow{display:flex;gap:12px;align-items:center;line-height:1.45;font-size:.92rem}
.symic{width:44px;height:44px;flex:0 0 auto;background:var(--paper);border-radius:8px}
.glowdemo{width:30px;height:30px;margin:0 7px;border-radius:50%;flex:0 0 auto;border:3px solid rgba(255,214,120,.95);box-shadow:0 0 12px 4px rgba(255,200,90,.5)}
.spotdemo{width:14px;height:14px;margin:0 15px;flex:0 0 auto;transform:rotate(45deg);border:2px solid #fff;background:rgba(201,143,44,.9)}
.demo-rw{width:44px;text-align:center;font-size:1.5rem;flex:0 0 auto}
/* case board typing */
.typeans{display:flex;gap:8px}
.typeans input{flex:1;min-width:0;font:inherit;font-family:var(--f-ko);font-size:1.1rem;border-radius:10px;border:1px solid var(--ink-3);background:var(--ink-2);color:var(--paper);padding:8px 10px}
.pick{max-height:34vh;overflow-y:auto}
.pick .w{font-family:var(--f-ko);font-size:1.05rem;border:1px solid var(--ink-3);background:var(--ink-2);border-radius:10px;padding:6px 10px}
/* typed answers (on paper) */
.typeans.big input{font-size:1.35rem;padding:12px 14px;background:#f6f0e0;color:var(--paper-ink);border:1.5px solid var(--paper-ink)}
.hintline{font-family:var(--f-ko);font-size:1.3rem;letter-spacing:.12em;color:var(--paper-mute)}
.tfb{display:flex;flex-direction:column;gap:8px;background:#f6f0e0;border:1px solid #cbbf9f;border-radius:12px;padding:12px 14px}
.tfrow{display:flex;gap:12px;align-items:baseline}
.tfrow span{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-mute);flex:0 0 72px}
.tfrow b{font-family:var(--f-ko);font-weight:400;font-size:1.4rem}
mark.bad{background:rgba(181,65,45,.18);color:var(--cinnabar);text-decoration:line-through;border-radius:3px;padding:0 2px}
mark.fix{background:rgba(63,139,119,.2);color:var(--celadon);font-weight:700;border-radius:3px;padding:0 2px}
/* case board: deductions + evidence */
.ded{font-size:1.05rem;line-height:2.1}
.slot{display:inline-block;min-width:54px;text-align:center;font-family:var(--f-ko);font-size:1.1rem;line-height:1.5;padding:0 8px;margin:0 2px;border-radius:8px;vertical-align:baseline}
.slot.empty{border:1.5px dashed var(--mist);color:var(--mist);background:transparent}
.slot.filled{border:1.5px solid var(--paper);background:var(--ink-2);color:var(--paper)}
.slot.active{border-color:var(--ochre);box-shadow:0 0 0 3px rgba(201,143,44,.35)}
.slot.done{border:0;background:rgba(124,195,174,.15);color:var(--celadon-lt);font-weight:700}
.q.open{border-color:rgba(201,143,44,.6)}
.btn-ink.primary{background:var(--paper);color:var(--paper-ink)}
.evlist{display:flex;flex-direction:column;gap:8px}
.evcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--ink);border:1px solid var(--ink-3);border-radius:12px;padding:10px 12px;color:var(--paper)}
.evcard svg{width:46px;height:46px;flex:0 0 auto;background:var(--paper);border-radius:8px}
.evcard b{display:block;font-family:var(--f-ko);font-weight:400;font-size:1.1rem}
.evcard small{display:block;color:var(--mist);font-size:.82rem;line-height:1.35;margin-top:2px}
#sb .evcard{background:#f6f0e0;border-color:#cbbf9f;color:var(--paper-ink)}
#sb .evcard small{color:var(--paper-mute)}
/* menu */
.menulist{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:14px;text-align:left;background:var(--ink);border:1px solid var(--ink-3);border-radius:12px;padding:12px 14px}
.mi .mic{width:28px;display:grid;place-items:center;font-size:1.3rem;color:var(--paper)}
.mi b{display:block;font-weight:600}
.mi small{color:var(--mist);font-size:.82rem}
.hintbox{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:12px 14px;line-height:1.5}
/* rewind */
.scene.rewinding .artwrap{filter:sepia(.8) contrast(.9) blur(1px);transition:filter .3s}
.rewind-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:3rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:rwspin .9s ease}
@keyframes rwspin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* camera frame you drag */
.fx .vf{pointer-events:auto;position:absolute;inset:auto;width:44%;height:52%;border:2px solid rgba(255,255,255,.9);border-radius:6px;cursor:grab;touch-action:none;
  box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.fx .vf::after{width:26px;height:26px}
.fx .vf span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:.7rem;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:99px;white-space:nowrap}
/* history */
.hl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--paper-2)}
.hl .hn{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-mute)}
.hl .hk{font-family:var(--f-ko);font-size:1.2rem;line-height:1.5}
.hl .say{margin-left:0;flex:0 0 auto}
.hl.you .hk{color:var(--celadon)}
.narr-row{color:var(--paper-mute);font-size:.92rem;line-height:1.5;font-style:italic}
</style>

    <button class="ib" id="bNote" aria-label="Notebook"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg><span class="dot" id="noteDot" hidden></span></button>
