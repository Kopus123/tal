<style>
/* Layout: one-screen phone game. Ink-night frame, scene window on top, hanji paper dialogue sheet below. */
:root{
  --ink:#151a24;        /* night ink, page ground */
  --ink-2:#212937;      /* bars, sheets */
  --ink-3:#2e3848;
  --mist:#aab4c3;       /* secondary text on ink */
  --paper:#ebe2cd;      /* hanji */
  --paper-2:#ded3ba;
  --paper-ink:#2a231d;  /* text on paper */
  --paper-mute:#7b705f;
  --celadon:#3f8b77;    /* dancheong green: learned */
  --celadon-lt:#7cc3ae;
  --ochre:#c98f2c;      /* dancheong ochre: unknown words */
  --cinnabar:#b5412d;   /* sparing: alerts */
  --f-brush:"Nanum Brush Script","Gowun Batang",serif;
  --f-ko:"Gowun Batang","Noto Serif KR",serif;
  --f-ui:"Gowun Dodum","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--celadon-lt);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;box-sizing:border-box}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;min-height:44px}
.loc{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.loc .ko{white-space:nowrap;flex:none;font-family:var(--f-brush);font-size:2rem;line-height:1;color:var(--paper);background:none;border:0;padding:0}
.loc .sub{font-size:.78rem;color:var(--mist);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--ink-3);background:var(--ink-2);display:grid;place-items:center;padding:0}
.ib svg{width:20px;height:20px;stroke:var(--paper);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ochre)}

/* scene */
.scene{position:relative;width:min(100%,52vh);aspect-ratio:4/3;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;background:#0d1118;flex:0 0 auto;box-shadow:0 0 0 1px var(--ink-3)}
.scene svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.hs i{width:14px;height:14px;transform:rotate(45deg);border:2px solid #fff;background:rgba(201,143,44,.85);box-shadow:0 0 0 4px rgba(255,255,255,.18);animation:pulse 2.4s ease-in-out infinite}
.hs span{font-size:.7rem;background:rgba(21,26,36,.82);color:#f3ecdc;padding:2px 7px;border-radius:99px;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.vf{position:absolute;inset:8%;border:2px solid rgba(255,255,255,.7);border-radius:6px;pointer-events:none}
.vf::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);border:2px solid #ffd35a;border-radius:4px}
.drift{animation:drift 9s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-400px)}}
@media (prefers-reduced-motion:reduce){.drift,.hs i{animation:none}}

/* paper sheet */
.sheet{flex:1;min-height:0;background:var(--paper);color:var(--paper-ink);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(rgba(120,100,70,.08) 1px,transparent 1.4px),radial-gradient(rgba(120,100,70,.06) 1px,transparent 1.2px);background-size:7px 7px,11px 13px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:12px}
.sheet-foot{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.who{display:flex;align-items:center;gap:10px}
.chip{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-ko);font-weight:700;color:#fff;flex:0 0 auto}
.who b{font-family:var(--f-ko);font-size:1rem}
.who .say{margin-left:auto;border:1px solid var(--paper-2);background:transparent;border-radius:99px;padding:4px 10px;font-size:.8rem;color:var(--paper-mute)}
.koline{font-family:var(--f-ko);font-size:1.5rem;line-height:1.7;word-break:keep-all;text-wrap:pretty}
.koline.sign{background:#f6f0e0;border:1px solid #cbbf9f;box-shadow:2px 3px 0 rgba(60,45,25,.12);padding:12px 16px;border-radius:4px;transform:rotate(-.6deg);white-space:pre-line;font-size:1.4rem}
.koline.led{font-family:ui-monospace,monospace;background:#120e0a;color:#ffb347;padding:10px 14px;border-radius:6px;font-size:1.25rem}
.en{font-size:.98rem;line-height:1.55;color:var(--paper-mute);max-width:62ch}
.narr{font-size:1.06rem;line-height:1.6;color:var(--paper-ink)}
.w{background:none;border:0;padding:0 1px;margin:0;font:inherit;color:inherit;border-bottom:2px dotted var(--ochre);border-radius:2px}
.w.hunch{border-bottom:2px solid var(--ochre)}
.w.learned{color:var(--celadon);border-bottom:2px solid rgba(63,139,119,.35)}
.w.gram{border-bottom:1px solid rgba(123,112,95,.4);color:#5b5246}
.w:active{background:rgba(201,143,44,.2)}
.led .w{border-bottom-color:#7a5520}
.btn{border:1.5px solid var(--paper-ink);background:transparent;border-radius:12px;padding:12px 14px;text-align:left;font-size:1rem;display:flex;align-items:center;gap:10px;min-height:48px}
.btn.ko{font-family:var(--f-ko);font-size:1.25rem}
.btn.act{font-style:normal;color:var(--paper-ink)}
.btn.act::before{content:"";width:8px;height:8px;transform:rotate(45deg);background:var(--ochre);flex:0 0 auto}
.btn.primary{background:var(--paper-ink);color:var(--paper);justify-content:center;font-weight:600}
.btn:active{transform:translateY(1px)}
.acts{display:flex;flex-direction:column;gap:8px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-ko);font-size:1.2rem;border:1.5px solid var(--paper-ink);background:#f6f0e0;border-radius:10px;padding:8px 12px}
.tile[disabled]{opacity:.25}
.built{min-height:56px;border-bottom:2px solid var(--paper-ink);font-family:var(--f-ko);font-size:1.45rem;display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.built .ph{color:var(--paper-mute);font-family:var(--f-ui);font-size:.95rem}
.row{display:flex;gap:8px}
.row>*{flex:1}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--paper-ink);background:#fff;margin:6px auto;display:block;box-shadow:inset 0 0 0 4px var(--paper)}
.photo{width:100%;max-width:320px;border:8px solid #fff;border-bottom-width:28px;box-shadow:0 4px 14px rgba(0,0,0,.25);transform:rotate(1.2deg);align-self:center}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,13,19,.6);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px))}
.panel{width:100%;max-width:560px;max-height:88%;background:var(--ink-2);color:var(--paper);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.panel.paper{background:var(--paper);color:var(--paper-ink)}
.ph-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ink-3)}
.paper .ph-head{border-color:var(--paper-2)}
.ph-head h2{margin:0;font-family:var(--f-brush);font-weight:400;font-size:1.9rem;line-height:1;flex:1}
.ph-head .x{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px}
.ph-body{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--ink-3);background:transparent;border-radius:99px;padding:6px 12px;font-size:.85rem;color:var(--mist)}
.tab.on{background:var(--paper);color:var(--paper-ink);border-color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{border:1px solid var(--ink-3);background:var(--ink);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;justify-content:center}
.card .k{font-family:var(--f-ko);font-size:1.15rem;word-break:keep-all;text-align:center}
.card .ic{font-size:1.2rem;min-height:1.3em}
.card .tag{font-size:.65rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.card.learned{border-color:rgba(124,195,174,.5)}
.card.learned .k{color:var(--celadon-lt)}
.card.hunch .tag{color:var(--ochre)}
.card.new .tag{color:var(--ochre)}
.empty{color:var(--mist);font-size:.92rem;line-height:1.5}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mist)}
.paper .label{color:var(--paper-mute)}
.bigword{font-family:var(--f-ko);font-size:2.6rem;line-height:1.1}
.badge{display:inline-block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.ctx{font-family:var(--f-ko);font-size:1.05rem;line-height:1.55;padding:8px 10px;border-left:3px solid var(--paper-2);background:rgba(255,255,255,.35)}
.ctx mark{background:rgba(201,143,44,.28);color:inherit;padding:0 2px;border-radius:2px}
.guess{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.guess button{font-size:1.6rem;border:1.5px solid var(--paper-2);background:#f6f0e0;border-radius:12px;padding:12px 0}
.guess.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;box-sizing:border-box;min-height:64px;border-radius:10px;border:1px solid var(--paper-2);background:#f6f0e0;color:var(--paper-ink);font:inherit;padding:10px;resize:vertical}
.q{border:1px solid var(--ink-3);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--ink)}
.q.solved{border-color:rgba(124,195,174,.45)}
.q .qt{font-size:1.02rem;line-height:1.45}
.q .ans{font-family:var(--f-ko);font-size:1.4rem;color:var(--celadon-lt)}
.q .why{color:var(--mist);font-size:.9rem;line-height:1.5}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font-family:var(--f-ko);font-size:1.05rem;border:1px solid var(--ink-3);background:var(--ink-2);border-radius:10px;padding:6px 10px}
.pick button.learned{color:var(--celadon-lt)}
.miss{color:#e59a87;font-size:.9rem}
.btn-ink{border:1px solid var(--ink-3);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 14px;font-size:1rem}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--paper);color:var(--paper-ink);border-radius:99px;padding:8px 16px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:tin .3s ease-out}
.toast b{font-family:var(--f-ko);color:var(--celadon)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* phone */
.phone{width:min(100%,380px);height:min(86%,700px);background:#0b0d12;border-radius:34px;border:8px solid #1b1f27;display:flex;flex-direction:column;overflow:hidden;margin:auto;align-self:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.ov.center{align-items:center}
.ph-status{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:.75rem;color:#c9cfdb}
.ph-top{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;border-bottom:1px solid #222834;color:#fff}
.ph-top b{flex:1;font-size:1.05rem}
.ph-top button{border:0;background:none;color:#8fd3c0;font-size:1rem;padding:6px}
.ph-list{flex:1;overflow-y:auto}
.thr{width:100%;border:0;background:none;color:#e9edf3;text-align:left;display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #1a1f29;align-items:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:0 0 auto;color:#fff}
.thr .nm{font-weight:600}
.thr .pv{font-size:.82rem;color:#8b93a3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .new{width:9px;height:9px;border-radius:50%;background:#3fbf9b;margin-left:auto;flex:0 0 auto}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#10141b}
.day{align-self:center;font-size:.8rem;color:#8b93a3;font-family:var(--f-ko);padding:6px 0}
.day .w{border-bottom-color:#6e5a32}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-family:var(--f-ko);font-size:1.12rem;line-height:1.5;color:#e9edf3;background:#252c39;align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:#2f6f61;border-radius:16px;border-bottom-right-radius:4px}
.bub small{display:block;font-family:var(--f-ui);font-size:.68rem;color:#9aa3b3;margin-top:2px}
.bub .w{border-bottom-color:#b88a3a}
.bub .w.learned{color:#9be0cb}
.bub .w.gram{color:#c9cfdb;border-bottom-color:rgba(201,207,219,.3)}
.bub.sys{align-self:center;background:transparent;color:#e07b69;font-size:.9rem}
.ph-note{font-size:.88rem;color:#9aa3b3;line-height:1.5;padding:8px 4px}

/* title */
.title{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.title .art{width:min(100%,420px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--ink-3)}
.title .art svg{width:100%;height:100%;display:block}
.title h1{font-family:var(--f-brush);font-weight:400;font-size:5.5rem;line-height:.9;margin:6px 0 0;color:var(--paper)}
.title .vil{font-family:var(--f-ko);font-size:1.15rem;color:var(--mist);letter-spacing:.3em}
.title p{max-width:34ch;color:var(--mist);line-height:1.55;margin:0;font-size:.95rem}
.title .acts{width:min(100%,320px)}
.title .btn{border-color:var(--paper);color:var(--paper);justify-content:center}
.title .btn.primary{background:var(--paper);color:var(--paper-ink)}
.fine{font-size:.78rem;color:#6f7a8b;max-width:36ch;line-height:1.5}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink-3)}
.set-row .seg{display:flex;gap:4px}
.set-row .seg button{border:1px solid var(--ink-3);background:var(--ink);border-radius:8px;padding:6px 10px;font-size:.85rem}
.set-row .seg button.on{background:var(--paper);color:var(--paper-ink)}
.stat{display:flex;justify-content:space-between;font-size:1rem;padding:8px 0;border-bottom:1px solid var(--paper-2)}
.stat b{font-variant-numeric:tabular-nums}
</style>

<div id="app">

    <button class="ib" id="bCase" aria-label="Case board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><circle cx="16" cy="9" r="1.6"/><circle cx="12" cy="15.5" r="1.6"/><path d="M8 9l4 6.5L16 9"/></svg><span class="dot" id="caseDot" hidden></span></button>
    <button class="ib" id="bHint" aria-label="Think"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    <button class="ib" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </div>
  <div class="scene" id="scene"></div>
  <div class="sheet"><div class="sheet-body" id="sb"></div><div class="sheet-foot" id="sf"></div></div>
</div>

/* ============ TOKENS ============ */
const TOK=/\{([^}|]+)(?:\|([^}]+))?\}/g;
const plain=s=>s.replace(TOK,'$1');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wrec(id){return S.w[id]||(S.w[id]={ctx:[],L:0,note:'',wrong:-1})}
function see(id,line){if(!W[id])return;const r=wrec(id);if(!r.ctx.includes(line)){r.ctx.push(line);if(r.ctx.length>6)r.ctx.shift();r.n=(r.n||0)+1}}
function status(id){const d=W[id];if(!d)return'new';if(d.g)return'gram';const r=S.w[id];if(r&&r.L)return'learned';if(r&&r.H)return'hunch';return'new'}
function ko(str,tap=true){
  return str.replace(TOK,(m,surf,id)=>{id=id||surf;see(id,str);
    return tap?`<button class="w ${status(id)}" data-w="${esc(id)}">${esc(surf)}</button>`:esc(surf)}).replace(/\n/g,'<br>');
}
function learn(id,quiet){if(!W[id]||W[id].g)return;const r=wrec(id);if(r.L)return;r.L=1;if(!quiet)toast(`${W[id].i} <b>${id}</b> figured out`);checkPattern()}
const idsIn=s=>[...s.matchAll(TOK)].map(m=>m[2]||m[1]);
function checkPattern(){const seen=PAST.filter(p=>S.w[p[1]]).length;if(seen>=3&&!F.pattern){F.pattern=1;toast('Pattern spotted. Check your notebook.')}}

/* ============ VOICE ============ */
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^ko/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// Recorded neural-voice clips (audio/clips.js defines window.AUDIO = {"voice|text": "audio/n.mp3"}); phone TTS is the fallback.
const normT=s=>plain(s).replace(/[📸🏮^♡✖📞]/gu,'').replace(/\//g,', ').replace(/\s+/g,' ').trim();
const vg=who=>['sujin','yuna','minsu','ajeossi','staff','bus','you','word'].includes(who)?who:'sign';
let AUD=null;
function speak(text,who){
  const t=normT(text);if(!t)return;
  const f=window.AUDIO&&window.AUDIO[vg(who)+'|'+t];
  if(AUD){AUD.pause();AUD=null}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(f){AUD=new Audio(f);AUD.playbackRate=S.set.slow?.75:1;AUD.preservesPitch=true;AUD.play().catch(()=>tts(t,who));return}
  tts(t,who);
}
function allLines(){
  const out=new Set(),add=(w,s)=>{s=normT(s);if(s)out.add(w+'|'+s)};
  for(const id in N){const n=N[id];if(n.ko)add(vg(n.who),n.ko);(n.ch||[]).forEach(c=>c.ko&&add('you',c.ko));
    if(n.tiles){n.tiles.forEach(t=>add('you',t));n.ans.forEach(a=>add('you',a[0].join(' ')))}}
  for(const id in W)add('word',id);
  T.forEach(t=>t.m.forEach(m=>m.ko&&!m.sys&&add('sign',m.ko)));
  add('sujin','안녕하세요');return[...out];
}
function tts(t,who){
  if(!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(VOICE)u.voice=VOICE;
  const c=C[who]||{};u.pitch=c.p||1;u.rate=(c.r||1)*(S.set.slow?.62:.88);speechSynthesis.speak(u);
}

const $=s=>document.querySelector(s);
let bseq=[];
function enter(loc){
  S.loc=loc;const l=L[loc];S.node=null;
  if(l.always){go(l.always);return}
  if(l.first&&!S.visited[loc]){S.visited[loc]=1;go(l.first);return}
  S.visited[loc]=1;save();render();
}
function go(id){
  const nd=N[id];if(!nd){S.node=null;save();render();return}
  S.node=id;bseq=[];if(nd.fx)nd.fx();save();render();
  if(S.set.auto&&nd.ko)speak(nd.ko,nd.who);
}
function next(){
  const nd=N[S.node];
  if(nd&&nd.next)go(nd.next);else{S.node=null;save();render();if(F.pendingFinale){F.pendingFinale=0;finale()}}
}
function choose(c){
  if(c.ko){ko(c.ko);speak(c.ko,'you')}
  (c.learn||[]).forEach(x=>learn(x));
  setTimeout(()=>go(c.go),c.ko?450:0);
}

function render(){
  const l=L[S.loc]||L.madang;const nd=S.node?N[S.node]:null;
  // bar
  const lk=$('#locKo');lk.textContent=l.ko;
  const wid=W[l.ko]?l.ko:null;lk.dataset.w=wid||'';
  $('#locSub').textContent=l.sub;
  // scene
  const sc=$('#scene');let h=l.art();
  if(nd&&nd.type==='camera')h+=`<div class="vf"></div>`;
  if(!nd)l.hs.forEach((x,i)=>{if(x.show&&!x.show())return;h+=`<button class="hs" data-hs="${i}" style="left:${x.x}%;top:${x.y}%" aria-label="${esc(x.l)}"><i></i><span>${esc(x.l)}</span></button>`});
  h+=`<div class="flash" id="flash"></div>`;
  sc.innerHTML=h;
  sc.querySelectorAll('.hs').forEach(b=>b.onclick=()=>hot(+b.dataset.hs));
  // sheet
  const sb=$('#sb'),sf=$('#sf');let body='',foot='';
  if(!nd){
    body=`<div class="narr">${esc(l.desc())}</div>`;
    foot=`<div class="acts">${l.hs.map((x,i)=>(!x.show||x.show())?`<button class="btn act" data-hs="${i}">${esc(x.l)}</button>`:'').join('')}</div>`;
  }else if(nd.type==='build'){
    const tl=nd.tiles;
    body=`<div class="en">${esc(nd.en)}</div><div class="built">${bseq.length?bseq.map(i=>`<span>${ko(tl[i],false)}</span>`).join(''):'<span class="ph">Tap words to build a sentence</span>'}</div>
      <div class="tiles">${tl.map((t,i)=>`<button class="tile" data-t="${i}" ${bseq.includes(i)?'disabled':''}>${ko(t,false)}</button>`).join('')}</div>`;
    foot=`<div class="row"><button class="btn" id="bClr" style="justify-content:center">Clear</button><button class="btn primary" id="bSay" ${bseq.length?'':'disabled'}>Say it</button></div><button class="btn act" id="bLeave">Never mind</button>`;
  }else if(nd.type==='camera'){
    body=`<div class="narr">${esc(nd.en)}</div>`;
    foot=`<button class="shutter" id="bShut" aria-label="Take photo"></button>`;
  }else if(nd.type==='photo'){
    body=`<svg class="photo" viewBox="0 0 300 220">${photoArt()}</svg><div class="narr">${esc(nd.en)}</div>`;
    foot=`<button class="btn primary" id="bNext">Continue</button>`;
  }else{
    const c=C[nd.who]||{};
    if(nd.who==='narr'){body=nd.en?`<div class="narr">${esc(nd.en)}</div>`:''}
    else if(nd.who==='sign'){body=`<div class="koline sign">${ko(nd.ko)}</div><div class="who"><button class="say" data-say style="margin-left:0">▶ Read aloud</button></div>${nd.en?`<div class="en">${esc(nd.en)}</div>`:''}`}
    else{body=`<div class="who"><span class="chip" style="background:${c.c}">${esc(c.n[0])}</span><b>${esc(c.n)}</b><button class="say" data-say>▶ Again</button></div>
      <div class="koline ${nd.led?'led':''}">${ko(nd.ko)}</div>${nd.en?`<div class="en">${esc(nd.en)}</div>`:''}`}
    if(nd.ch)foot=`<div class="acts">${nd.ch.map((x,i)=>`<button class="btn ${x.ko?'ko':'act'}" data-ch="${i}">${x.bell?'🔔 ':''}${x.ko?ko(x.ko,false):esc(x.en)}</button>`).join('')}</div>`;
    else foot=`<button class="btn primary" id="bNext">${nd.next?'Continue':'Look around'}</button>`;
  }
  sb.innerHTML=body;sf.innerHTML=foot;sb.scrollTop=0;
  // wire
  sf.querySelectorAll('[data-hs]').forEach(b=>b.onclick=()=>hot(+b.dataset.hs));
  sf.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>choose(nd.ch[+b.dataset.ch]));
  const bn=$('#bNext');if(bn)bn.onclick=next;
  const bs=sb.querySelector('[data-say]');if(bs)bs.onclick=()=>speak(nd.ko,nd.who);
  sb.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{bseq.push(+b.dataset.t);speak(nd.tiles[+b.dataset.t],'you');render()});
  if($('#bClr'))$('#bClr').onclick=()=>{bseq=[];render()};
  if($('#bLeave'))$('#bLeave').onclick=()=>{S.node=null;save();render()};
  if($('#bSay'))$('#bSay').onclick=()=>say(nd);
  if($('#bShut'))$('#bShut').onclick=()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');setTimeout(()=>{if(nd.shot)nd.shot();go(nd.next)},500)};
  dots();save();
}
function say(nd){
  const words=bseq.map(i=>nd.tiles[i]);const line=words.join(' ');speak(line,'you');ko(line);
  const hit=nd.ans.find(a=>a[0].length===words.length&&a[0].every((w,i)=>w===words[i]));
  if(hit)idsIn(line).forEach(x=>learn(x));
  setTimeout(()=>{if(hit){const t=typeof hit[1]==='function'?hit[1]():hit[1];go(t)}else go(nd.miss)},600);
}
function hot(i){const x=L[S.loc].hs[i];if(!x)return;if(x.go)go(typeof x.go==='function'?x.go():x.go);else x.act()}
function dots(){
  const anyNew=Object.keys(S.w).some(id=>W[id]&&!W[id].g&&!S.nb[id]);$('#noteDot').hidden=!anyNew;
  $('#caseDot').hidden=!Q.some(q=>q.show()&&!solved(q.id));
}

function overlay(html,cls=''){const o=document.createElement('div');o.className='ov '+cls;o.innerHTML=html;o.addEventListener('click',e=>{if(e.target===o)close(o)});$('#ovs').appendChild(o);return o}

function wordSheet(id){
  const d=W[id];if(!d)return;const r=wrec(id);S.nb[id]=1;const st=status(id);
  const o=overlay(`<div class="panel paper" role="dialog" aria-label="${esc(id)}"><div class="ph-head"><h2>수첩</h2><button class="x" aria-label="Close">×</button></div><div class="ph-body" id="wsb"></div></div>`);
  o.querySelector('.x').onclick=()=>close(o);
  const draw=()=>{
    const st=status(id);
    const badge=st==='learned'?`<span class="badge" style="color:var(--celadon)">Figured out ${d.i}</span>`:st==='hunch'?`<span class="badge" style="color:var(--ochre)">Hunch ${d.i}?</span>`:st==='gram'?`<span class="badge" style="color:var(--paper-mute)">Grammar piece</span>`:`<span class="badge" style="color:var(--ochre)">New word</span>`;
    const ctx=r.ctx.slice(-4).reverse().map(l=>`<div class="ctx">${plain(l).split(id.includes('/')?'\u0000':id).map(esc).join(`<mark>${esc(id)}</mark>`)}</div>`).join('')||'<div class="empty">Not seen anywhere yet.</div>';
    let guess='';
    if(st==='hunch')guess=`<div class="label">Just a hunch so far. It counts as figured out once you use it right in the story.</div>`;
    else if(st==='new'){
      const n=r.n||0;
      if((r.wrong??-1)<n){const opts=shuffle([d.i,...pickIcons(d.i,3)]);
        guess=`<div class="label">Got a hunch what it means?</div><div class="guess" id="gz">${opts.map(x=>`<button data-g="${esc(x)}">${x}</button>`).join('')}</div>`}
      else guess=`<div class="label">Not that one. Find it somewhere else first, then try again.</div>`;
    }
    o.querySelector('#wsb').innerHTML=`<div class="bigword">${esc(id)}</div><div class="row" style="flex:none;align-items:center;gap:10px"><span>${badge}</span><button class="say" id="wsay" style="flex:none;border:1px solid var(--paper-2);background:none;border-radius:99px;padding:6px 12px">▶ Hear it</button></div>
      <div class="label">Where you've seen it</div>${ctx}${guess}
      <div class="label">Your own note</div><textarea id="wnote" placeholder="Write what you think it means, in your own words.">${esc(r.note||'')}</textarea>`;
    o.querySelector('#wsay').onclick=()=>speak(id,'word');
    o.querySelector('#wnote').oninput=e=>{r.note=e.target.value;save()};
    o.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      if(b.dataset.g===d.i){r.H=1;save();toast(`Hunch noted: <b>${id}</b> ${d.i}?`);draw()}else{r.wrong=r.n||0;save();const gz=o.querySelector('#gz');gz.classList.add('shake');setTimeout(draw,420)}
    });
  };draw();save();
}
function pickIcons(not,n){const pool=[...new Set(Object.values(W).filter(x=>!x.g&&x.i&&x.i!==not).map(x=>x.i))];return shuffle(pool).slice(0,n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let nbTab='all';
function notebook(){
  Object.keys(S.w).forEach(id=>S.nb[id]=1);save();
  const o=overlay(`<div class="panel"><div class="ph-head"><h2>수첩</h2><button class="x" aria-label="Close">×</button></div><div class="ph-body" id="nbb"></div></div>`);
  o.querySelector('.x').onclick=()=>close(o);
  const draw=()=>{
    const ids=Object.keys(S.w).filter(id=>W[id]);
    const vocab=ids.filter(id=>!W[id].g),gram=ids.filter(id=>W[id].g);
    const learned=vocab.filter(id=>status(id)==='learned').length;
    const list=nbTab==='all'?vocab:nbTab==='todo'?vocab.filter(id=>status(id)!=='learned'):nbTab==='learned'?vocab.filter(id=>status(id)==='learned'):[];
    let inner=`<div class="tabs">${[['all','All words'],['todo','Still figuring out'],['learned','Figured out'],['gram','Grammar'],['pat','Patterns']].map(([k,t])=>`<button class="tab ${nbTab===k?'on':''}" data-tab="${k}">${t}</button>`).join('')}</div>
      <div class="label">${learned} figured out · ${vocab.length} seen</div>`;
    if(nbTab==='gram')inner+=gram.length?`<div class="grid">${gram.map(id=>`<button class="card" data-w="${esc(id)}"><span class="k">${esc(id)}</span><span class="tag">grammar</span></button>`).join('')}</div>`:`<div class="empty">Particles and endings you spot will collect here.</div>`;
    else if(nbTab==='pat'){
      if(!F.pattern)inner+=`<div class="empty">Nothing yet. Keep listening to how people talk about this morning.</div>`;
      else inner+=`<div class="q"><div class="qt">The ㅆ pattern</div><div class="why">People keep using these ㅆ versions whenever they talk about this morning.</div>
        ${PAST.filter(p=>S.w[p[1]]).map(p=>`<div style="font-family:var(--f-ko);font-size:1.3rem">${p[0]} <span style="color:var(--mist)">→</span> <button class="w ${status(p[1])}" data-w="${p[1]}" style="color:var(--celadon-lt)">${p[1]}</button></div>`).join('')}</div>`;
    }
    else inner+=list.length?`<div class="grid">${list.map(id=>{const st=status(id);return`<button class="card ${st}" data-w="${esc(id)}"><span class="ic">${st==='learned'?W[id].i:st==='hunch'?W[id].i+'?':'?'}</span><span class="k">${esc(id)}</span><span class="tag">${st==='learned'?'figured out':st==='hunch'?'hunch':'new'}</span></button>`}).join('')}</div>`:`<div class="empty">Nothing here yet.</div>`;
    o.querySelector('#nbb').innerHTML=inner;
    o.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{nbTab=b.dataset.tab;draw()});
  };
  draw();
  o.addEventListener('click',()=>setTimeout(()=>{if(document.body.contains(o))draw()},50));
}

let pickQ=null;
function caseBoard(){
  const o=overlay(`<div class="panel"><div class="ph-head"><h2>사건</h2><button class="x" aria-label="Close">×</button></div><div class="ph-body" id="cbb"></div></div>`);
  o.querySelector('.x').onclick=()=>close(o);
  const draw=(miss)=>{
    const qs=Q.filter(q=>q.show());
    const cards=Object.keys(S.w).filter(id=>W[id]&&!W[id].g);
    let h=qs.length?'<div class="empty">Answer each question with a word from your notebook.</div>':'<div class="empty">No questions yet. Look around and see what you can find.</div>';
    h+=qs.map(q=>{
      if(solved(q.id))return`<div class="q solved"><div class="qt">${esc(q.q)}</div><div class="ans">${W[q.a].i} ${esc(q.a)}</div><div class="why">${esc(q.why)}</div></div>`;
      const open=pickQ===q.id;
      return`<div class="q"><div class="qt">${esc(q.q)}</div>${open?`<div class="pick">${cards.map(id=>`<button class="${status(id)}" data-pk="${esc(id)}">${esc(id)}</button>`).join('')}</div>${miss?`<div class="miss">That doesn't fit the evidence.</div>`:''}`:`<button class="btn-ink" data-open="${q.id}">Pick an answer</button>`}</div>`;
    }).join('');
    o.querySelector('#cbb').innerHTML=h;
    o.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{pickQ=b.dataset.open;draw()});
    o.querySelectorAll('[data-pk]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const q=Q.find(x=>x.id===pickQ);
      if(b.dataset.pk===q.a){S.cs[q.id]=1;learn(q.a,1);pickQ=null;toast('Solved');save();draw();
        if(q.id==='q5'){setTimeout(()=>{close(o);finale()},700)}
        else if(caseReady()&&S.loc==='museum')toast('Case notes done. Head home.');
      }else draw(true)});
  };
  draw();
}

  const list=()=>{

function hint(){
  let h;
  if(!F.intro)h="Listen to 수진. Watch what she does with her hands while she talks.";
  else if(!F.th_museum)h="수진 gave you 할머니's phone. People text about their plans.";
  else if(!F.maskMissing)h="The workshop is where 할머니 spends her days. Have a look.";
  else if(!F.sawPhoto)h="Head out the front gate. The village is waking up, and someone might have seen something.";
  else if(!F.talked&&S.loc==='golmok')h=F.heardDir?"He said which way to go. Tap the couple if you want to hear it again.":"Ask the couple where the bus stop is.";
  else if(!F.talked)h="The restaurant owner sees everyone who walks past. Try talking to him.";
  else if(!F.museumDone)h="She left on a bus. Her phone said where she was going. Listen for that stop.";
  else if(!caseReady())h="Open the case board. You have enough to answer the questions.";
  else if(!F.ending)h="You've learned what you can at the museum. Take the bus home.";
  else if(!solved('q5'))h="Who wrote on the back of that photo in the workshop? What did 수진 just say?";
  else h="The prologue is done. Look back through your notebook while you wait for Chapter 1.";
